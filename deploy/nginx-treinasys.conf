# TreinaSys - Nginx
#
# Copiar para /etc/nginx/sites-available/treinasys, criar o link em
# sites-enabled, trocar SEU_DOMINIO e recarregar.
#
# O HTTPS nao esta escrito aqui de proposito: o certbot injeta os blocos de SSL
# sozinho quando rodar `certbot --nginx -d SEU_DOMINIO`.

upstream treinasys_api {
    server 127.0.0.1:3333;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO;

    # O front compilado e estatico. O Nginx entrega direto, sem passar por Node.
    root /var/www/treinasys/frontend/dist;
    index index.html;

    client_max_body_size 25M;

    # Nao anunciar a versao do Nginx.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API
    location /api/ {
        proxy_pass http://treinasys_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Sem esta linha o rate limiting e a auditoria registrariam o IP do proxy
        # em toda requisicao, e o app confia nela por causa do trust proxy.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://treinasys_api/health;
        access_log off;
    }

    # Arquivos com hash no nome podem ser cacheados para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: qualquer rota desconhecida devolve o index e o React resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O index nunca pode ser cacheado, senao o usuario fica preso numa versao velha.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~ /\. {
        deny all;
    }
}
